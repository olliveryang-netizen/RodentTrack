name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.13"]
        include:
          # Python 3.9 is no longer provided on the newest Ubuntu runners; keep testing it on Windows and macOS
          - os: windows-latest
            python: "3.9"
          - os: macos-latest
            python: "3.9"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install opencv-python-headless numpy pandas matplotlib pytest
      - name: Tests (synthetic videos with ground truth)
        run: python -m pytest -q tests
